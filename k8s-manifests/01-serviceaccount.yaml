# The pods' "badge" inside Kubernetes. The annotation links it to the Azure identity
# id-learningsteps-app (federated credential in infra-terraform/identity.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learningsteps-api
  namespace: learningsteps
  annotations:
    azure.workload.identity/client-id: "__APP_CLIENT_ID__"
automountServiceAccountToken: false
