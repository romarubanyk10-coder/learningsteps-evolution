# Tells Prometheus: "every 15 s, read /metrics from every API pod".
# It finds the pods by their label app=learningsteps-api in the namespace learningsteps.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: learningsteps-api
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["learningsteps"]
  selector:
    matchLabels:
      app: learningsteps-api
  podMetricsEndpoints:
    - port: http
      # Our metrics carry their own label "endpoint" (the API route, e.g. /entries).
      # Prometheus also adds a target label "endpoint" (the port name, here "http").
      # honorLabels: keep OUR value when the names collide.
      honorLabels: true
      path: /metrics
      interval: 15s
