# The "courier" order: which secret to fetch from Key Vault, with which identity,
# and as which Kubernetes Secret to hand it to the pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv
  namespace: learningsteps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__APP_CLIENT_ID__"
    keyvaultName: kv-learningsteps-evo
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: learningsteps-db
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
