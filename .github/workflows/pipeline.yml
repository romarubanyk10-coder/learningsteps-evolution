# CI/CD pipeline: every push to main is checked, scanned, built and deployed.
# Checks: lint/tests, security scans, Terraform. Then: build + image scan + push, deploy.
#
# Every third-party action is pinned to a full commit SHA (its "fingerprint"),
# not to a tag like @v7: a tag can be moved to malicious code, a SHA cannot
# (see the tj-actions/changed-files incident, March 2025).
name: CI/CD

on:
  push:
    branches: [main]
    # Screenshots and texts do not change the app: no checks, no deployment.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# The robot's default rights on this repository: read the code, nothing else.
permissions:
  contents: read

# Never run two pipelines for the same branch at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement app/requirements.txt pytest ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest)
        run: python -m pytest

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          extra_args: --results=verified,unknown

      - name: Dependency scan (trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configuration scan (trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform 1.17.0 (same version as on the admin's Mac)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Format check (terraform fmt)
        run: terraform -chdir=infra-terraform fmt -check -recursive

      - name: Init without the remote state (no Azure access needed)
        run: terraform -chdir=infra-terraform init -backend=false -input=false

      - name: Validate (terraform validate)
        run: terraform -chdir=infra-terraform validate

  build-and-push:
    name: Build, scan and push image
    # Runs only after BOTH checks are green, and only for a real push to main
    # (a pull request is checked, but never builds or deploys anything).
    needs: [lint-and-test, security-scan, terraform-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the image name (tag = short commit SHA)
        id: name
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: echo "image=${REGISTRY}/learningsteps-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker build --platform linux/amd64 --tag "$IMAGE" .

      - name: Scan image (trivy, stop on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ACR (repository-scoped token)
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          USERNAME: ${{ vars.ACR_TOKEN_USERNAME }}
          PASSWORD: ${{ secrets.ACR_TOKEN_PASSWORD }}
        run: echo "$PASSWORD" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Push image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker push "$IMAGE"

      - name: Log out of ACR
        if: always()
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: docker logout "$REGISTRY"

  deploy:
    name: Deploy to AKS
    # Only after the image was built, scanned and pushed successfully.
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write the deployer kubeconfig (from secret, owner-only file)
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Roll out the new image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: kubectl set image deployment/learningsteps-api api="$IMAGE" --namespace learningsteps

      - name: Wait until all pods run the new image
        run: kubectl rollout status deployment/learningsteps-api --namespace learningsteps --timeout=180s

      - name: Show the image that is now running
        run: kubectl get deployment learningsteps-api --namespace learningsteps --output jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Smoke test (/health through the public address)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$APP_URL/health"

      - name: Remove the kubeconfig
        if: always()
        run: rm -rf "$RUNNER_TEMP/kube"
