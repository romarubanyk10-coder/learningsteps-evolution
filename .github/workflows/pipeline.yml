# CI/CD pipeline: every push to main is checked, scanned, built and deployed.
# Stage 1 (this version): lint and tests. Later stages are added step by step.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The robot's default rights on this repository: read the code, nothing else.
permissions:
  contents: read

# Never run two deployments of the same branch at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement app/requirements.txt pytest ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest)
        run: python -m pytest
